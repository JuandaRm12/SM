<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Te gustaría ir a Salitre Mágico conmigo?</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="relative min-h-screen flex items-center justify-center overflow-x-hidden bg-slate-900 text-white">

    <!-- Fondo con la imagen de referencia y oscurecimiento para legibilidad -->
    <div class="absolute inset-0 z-0">
        <img src="image_98fba9.jpg" alt="Salitre Mágico Bogotá" class="w-full h-full object-cover filter brightness-50 scale-105 animate-pulse duration-[10000ms]">
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-black/60"></div>
    </div>

    <!-- Contenedor Principal -->
    <div class="relative z-10 max-w-lg w-full mx-4 p-8 bg-white/10 backdrop-blur-md rounded-3xl border border-white/20 shadow-2xl text-center transition-all duration-500">
        
        <!-- Icono decorativo / Emoticón -->
        <div class="inline-block p-4 bg-pink-500/20 rounded-full mb-6 border border-pink-400/30 animate-bounce">
            <span class="text-4xl">🎢🎡✨</span>
        </div>

        <!-- Título Principal -->
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-4 text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-yellow-300 drop-shadow-md">
            ¿Te gustaría ir a Salitre Mágico conmigo?
        </h1>

        <!-- Subtítulo descriptivo -->
        <p class="text-gray-200 text-sm md:text-base mb-8 leading-relaxed">
            
        </p>

        <!-- Botones de Interacción -->
        <div id="button-container" class="relative flex flex-col sm:flex-row items-center justify-center gap-4 h-24">
            <button id="btn-yes" class="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold rounded-2xl shadow-lg transform transition active:scale-95 hover:scale-105 text-lg cursor-pointer">
                ¡Sí!
            </button>
            <button id="btn-no" class="w-full sm:w-auto px-8 py-4 bg-gray-700/80 hover:bg-gray-600 text-gray-300 font-semibold rounded-2xl shadow transition text-lg cursor-pointer absolute sm:static">
                No.
            </button>
        </div>

        <!-- Mensaje de Éxito Oculto -->
        <div id="success-message" class="hidden opacity-0 transform scale-90 transition-all duration-500 mt-6 p-6 bg-pink-600/30 border border-pink-400/50 rounded-2xl">
            <h2 class="text-2xl font-bold text-yellow-300 mb-2">Lets Goooo</h2>
            <p class="text-gray-100 text-sm md:text-base">
                ¡Excelente elección! Jaja, tu eliges si vamos el Miercoles y el viernes!        
            </p>
        </div>

    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const buttonContainer = document.getElementById('button-container');
        const successMessage = document.getElementById('success-message');
        const cardContainer = document.querySelector('.relative.z-10');

        let clickCount = 0;
        const noPhrases = [
            "No puedo",
            "¿Segur@?",
            "Piénsalo bien...",
            "Habrá algodón de azúcar",
            "No me hagas esto :(",
            "El Salitre te llama...",
            "¡El botón de al lado es el bueno!"
        ];

        // Función para mover el botón "No" al pasar el cursor o hacer clic en dispositivos móviles
        function moveNoButton() {
            clickCount++;
            if (clickCount < noPhrases.length) {
                btnNo.innerText = noPhrases[clickCount];
            }

            // Generar posición aleatoria dentro de la pantalla o contenedor
            const containerRect = cardContainer.getBoundingClientRect();
            const btnRect = btnNo.getBoundingClientRect();

            const maxX = containerRect.width - btnRect.width - 20;
            const maxY = 120;

            const randomX = Math.floor(Math.random() * maxX) - (maxX / 2);
            const randomY = Math.floor(Math.random() * maxY) - (maxY / 2);

            btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        btnNo.addEventListener('mouseover', moveNoButton);
        btnNo.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Acción al hacer clic en "¡Sí!"
        btnYes.addEventListener('click', () => {
            // Ocultar botones
            buttonContainer.style.display = 'none';

            // Mostrar mensaje de éxito con animación
            successMessage.classList.remove('hidden');
            setTimeout(() => {
                successMessage.classList.remove('opacity-0', 'scale-90');
                successMessage.classList.add('opacity-100', 'scale-100');
            }, 50);

            // Lanzar confeti festivo
            var duration = 4 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        });
    </script>

</body>
</html>
